services:
  # ============================================================================
  # MySQL Database Service
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: touristsos_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-touristsos_db}
      MYSQL_USER: ${DB_USER:-tourist_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tourist_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - touristsos_net

  # ============================================================================
  # Django Web Application Service
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: touristsos_web
    restart: unless-stopped
    # Automatically execute pending migrations before starting the Django server
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-touristsos-docker-dev-key}
      - DEBUG=${DEBUG:-True}
      - DB_NAME=${DB_NAME:-touristsos_db}
      - DB_USER=${DB_USER:-tourist_user}
      - DB_PASSWORD=${DB_PASSWORD:-tourist_password}
      - DB_HOST=db
      - DB_PORT=3306
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,0.0.0.0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - touristsos_net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mysql_data:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  touristsos_net:
    driver: bridge

